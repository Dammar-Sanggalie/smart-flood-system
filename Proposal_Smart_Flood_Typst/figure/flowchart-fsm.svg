<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeStart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="nodeProcess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="nodeDecision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="stateSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="stateWarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="stateDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <linearGradient id="stateError" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="fsmShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <!-- Markers -->
    <marker id="fsmArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#475569"/>
    </marker>
    <marker id="fsmArrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#059669"/>
    </marker>
    <marker id="fsmArrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#D97706"/>
    </marker>
    <marker id="fsmArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Canvas Border & Background -->
  <rect width="960" height="660" rx="12" fill="url(#flowBg)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 32)">
    <text x="480" y="8" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">
      DIAGRAM ALIR LOGIKA FSM &amp; SIKLUS PENGENDALIAN SISTEM
    </text>
    <text x="480" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">
      Alur Pembacaan Sensor HC-SR04, Penentuan Status Siaga, Aktuasi Alarm, dan Pengiriman Telemetri
    </text>
  </g>

  <!-- ================= 1. START / INIT ================= -->
  <g transform="translate(390, 75)" filter="url(#fsmShadow)">
    <rect width="180" height="42" rx="21" fill="url(#nodeStart)"/>
    <text x="90" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      MULAI (Power On / Boot)
    </text>
  </g>

  <!-- Arrow Start -> Init HW -->
  <path d="M 480 117 L 480 135" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 2. INISIALISASI ================= -->
  <g transform="translate(330, 137)" filter="url(#fsmShadow)">
    <rect width="300" height="50" rx="8" fill="url(#nodeProcess)" stroke="#2563EB" stroke-width="1.5"/>
    <text x="150" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1E40AF" text-anchor="middle">
      Inisialisasi Perangkat Keras &amp; Wi-Fi
    </text>
    <text x="150" y="38" font-family="'Courier New', monospace" font-size="10.5" fill="#475569" text-anchor="middle">
      GPIO Init, Wire.begin(), lcd.init(), WiFi.begin()
    </text>
  </g>

  <!-- Arrow Init -> Read Sensor -->
  <path d="M 480 187 L 480 205" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 3. BACA SENSORIK ================= -->
  <g transform="translate(315, 207)" filter="url(#fsmShadow)">
    <rect width="330" height="54" rx="8" fill="url(#nodeProcess)" stroke="#2563EB" stroke-width="1.5"/>
    <text x="165" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1E40AF" text-anchor="middle">
      Pembacaan Sensor Ultrasonik HC-SR04
    </text>
    <text x="165" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      Kirim Trigger 10 µs → pulseIn(ECHO) → d = t / 58.0 → h = T_ref - d
    </text>
  </g>

  <!-- Arrow Read -> Decision Error -->
  <path d="M 480 261 L 480 279" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 4. DECISION: VALIDITAS SENSOR ================= -->
  <g transform="translate(360, 281)" filter="url(#fsmShadow)">
    <polygon points="120,0 240,32 120,64 0,32" fill="url(#nodeDecision)" stroke="#D97706" stroke-width="1.5"/>
    <text x="120" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#92400E" text-anchor="middle">
      Apakah Sensor Valid?
    </text>
    <text x="120" y="44" font-family="'Courier New', monospace" font-size="9.5" fill="#B45309" text-anchor="middle">
      (d &gt; 0 &amp;&amp; d &lt; 400 cm)
    </text>
  </g>

  <!-- Branch Error (Tidak) -> Right -->
  <path d="M 600 313 L 730 313 L 730 355" stroke="#DC2626" stroke-width="2" marker-end="url(#fsmArrowRed)"/>
  <rect x="620" y="297" width="55" height="18" rx="3" fill="#FEE2E2"/>
  <text x="647" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#DC2626" text-anchor="middle">TIDAK</text>

  <!-- Branch Valid (Ya) -> Down -->
  <path d="M 480 345 L 480 375" stroke="#059669" stroke-width="2" marker-end="url(#fsmArrowGreen)"/>
  <rect x="488" y="350" width="30" height="18" rx="3" fill="#D1FAE5"/>
  <text x="503" y="363" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">YA</text>

  <!-- ================= 5. DECISION: KETINGGIAN AIR ================= -->
  <!-- 3 Branches: SAFE (< 60 cm), WARNING (60-79 cm), DANGER (>= 80 cm) -->
  <path d="M 480 375 L 140 375 L 140 405" stroke="#059669" stroke-width="2" marker-end="url(#fsmArrowGreen)"/>
  <path d="M 480 375 L 390 375 L 390 405" stroke="#D97706" stroke-width="2" marker-end="url(#fsmArrowAmber)"/>
  <path d="M 480 375 L 610 375 L 610 405" stroke="#DC2626" stroke-width="2" marker-end="url(#fsmArrowRed)"/>

  <!-- ================= STATE 1: SAFE ================= -->
  <g transform="translate(50, 407)" filter="url(#fsmShadow)">
    <rect width="180" height="115" rx="8" fill="url(#stateSafe)" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="26" rx="8" fill="#059669"/>
    <text x="90" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: SAFE (AMAN)
    </text>
    <text x="90" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#065F46" text-anchor="middle">
      Tinggi Air &lt; 60 cm
    </text>
    <text x="14" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• LED Hijau : ON (GPIO 25)</text>
    <text x="14" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• LED Lain : OFF</text>
    <text x="14" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• Buzzer : PADAM</text>
    <text x="14" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#047857">• LCD : "STAT: AMAN"</text>
  </g>

  <!-- ================= STATE 2: WARNING ================= -->
  <g transform="translate(290, 407)" filter="url(#fsmShadow)">
    <rect width="200" height="115" rx="8" fill="url(#stateWarn)" stroke="#D97706" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#D97706"/>
    <text x="100" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: WARNING (SIAGA)
    </text>
    <text x="100" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400E" text-anchor="middle">
      60 cm ≤ Tinggi Air &lt; 80 cm
    </text>
    <text x="14" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• LED Kuning : ON (GPIO 26)</text>
    <text x="14" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• LED Hijau &amp; Merah : OFF</text>
    <text x="14" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• Buzzer : PADAM</text>
    <text x="14" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#92400E">• LCD : "STAT: SIAGA"</text>
  </g>

  <!-- ================= STATE 3: DANGER ================= -->
  <g transform="translate(520, 407)" filter="url(#fsmShadow)">
    <rect width="180" height="115" rx="8" fill="url(#stateDanger)" stroke="#DC2626" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="26" rx="8" fill="#DC2626"/>
    <text x="90" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: DANGER (BAHAYA)
    </text>
    <text x="90" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991B1B" text-anchor="middle">
      Tinggi Air ≥ 80 cm
    </text>
    <text x="14" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#991B1B">• 3x LED Merah : STROBO</text>
    <text x="14" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#991B1B">  (Running Tengah-Tepi)</text>
    <text x="14" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#991B1B">• Buzzer : 1000 Hz BUNYI</text>
    <text x="14" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#991B1B">• LCD : "BAHAYA !!" + Bar</text>
  </g>

  <!-- ================= STATE 4: SENSOR ERROR ================= -->
  <g transform="translate(730, 357)" filter="url(#fsmShadow)">
    <rect width="180" height="110" rx="8" fill="url(#stateError)" stroke="#64748B" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="26" rx="8" fill="#64748B"/>
    <text x="90" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: SENSOR ERROR
    </text>
    <text x="14" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Sinyal Pantul Hilang / Timeout</text>
    <text x="14" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• LED Merah Kedip Bersama</text>
    <text x="14" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Buzzer Nada Putus-Putus</text>
    <text x="14" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• LCD: "SENSOR ERROR"</text>
  </g>

  <!-- Convergence Arrows to Telemetry Task -->
  <path d="M 140 522 L 140 550 L 400 550" stroke="#059669" stroke-width="2"/>
  <path d="M 390 522 L 390 550 L 400 550" stroke="#D97706" stroke-width="2"/>
  <path d="M 610 522 L 610 550 L 560 550" stroke="#DC2626" stroke-width="2"/>
  <path d="M 820 467 L 820 550 L 560 550" stroke="#64748B" stroke-width="2"/>
  <path d="M 480 550 L 480 568" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 6. MULTI-TASK TIMERS (TELEMETRI & LCD) ================= -->
  <g transform="translate(240, 570)" filter="url(#fsmShadow)">
    <rect width="480" height="52" rx="8" fill="url(#nodeProcess)" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="240" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#6D28D9" text-anchor="middle">
      Tugas Non-Blocking Terjadwal (millis() Timer)
    </text>
    <text x="240" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      Setiap 2.000 ms: HTTP POST JSON ke Go Server | Setiap 2.500 ms: Rotasi Halaman LCD 16×2
    </text>
  </g>

  <!-- Loopback Line back to Sensor Reading -->
  <path d="M 240 596 L 20 596 L 20 234 L 313 234" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#fsmArrow)"/>
  <rect x="30" y="390" width="12" height="70" rx="3" fill="#DDD6FE"/>
  <text x="36" y="450" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#7C3AED" transform="rotate(-90, 36, 450)">
    LOOP BERIKUTNYA (Interval 100 ms)
  </text>
</svg>
