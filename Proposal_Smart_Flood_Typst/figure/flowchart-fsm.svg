<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeStart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="nodeProcess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="nodeDecision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="stateSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="stateWarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="stateDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="stateError" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="fsmShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <!-- Markers -->
    <marker id="fsmArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#475569"/>
    </marker>
    <marker id="fsmArrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#059669"/>
    </marker>
    <marker id="fsmArrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#D97706"/>
    </marker>
    <marker id="fsmArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#DC2626"/>
    </marker>
    <marker id="fsmArrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Canvas Border & Background -->
  <rect width="960" height="680" rx="14" fill="url(#flowBg)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 34)">
    <text x="480" y="8" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0F172A" letter-spacing="0.5">
      DIAGRAM ALIR LOGIKA FSM &amp; SIKLUS PENGENDALIAN SISTEM
    </text>
    <text x="480" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">
      Alur Pembacaan Sensor HC-SR04, Penentuan Status Siaga, Aktuasi Alarm, dan Pengiriman Telemetri
    </text>
  </g>

  <!-- ================= 1. START / INIT ================= -->
  <g transform="translate(380, 80)" filter="url(#fsmShadow)">
    <rect width="200" height="42" rx="21" fill="url(#nodeStart)"/>
    <text x="100" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      MULAI (Power On / Boot)
    </text>
  </g>

  <!-- Arrow Start -> Init HW -->
  <path d="M 480 122 L 480 144" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 2. INISIALISASI ================= -->
  <g transform="translate(290, 146)" filter="url(#fsmShadow)">
    <rect width="380" height="52" rx="8" fill="url(#nodeProcess)" stroke="#2563EB" stroke-width="1.5"/>
    <text x="190" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">
      Inisialisasi Perangkat Keras &amp; Wi-Fi
    </text>
    <text x="190" y="40" font-family="'Courier New', monospace" font-size="10.5" fill="#475569" text-anchor="middle">
      GPIO Init • Wire.begin() • lcd.init() • WiFi.begin()
    </text>
  </g>

  <!-- Arrow Init -> Read Sensor -->
  <path d="M 480 198 L 480 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 3. BACA SENSORIK ================= -->
  <g transform="translate(265, 222)" filter="url(#fsmShadow)">
    <rect width="430" height="54" rx="8" fill="url(#nodeProcess)" stroke="#2563EB" stroke-width="1.5"/>
    <text x="215" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">
      Pembacaan Sensor Ultrasonik HC-SR04
    </text>
    <text x="215" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">
      Trigger 10 µs → pulseIn(ECHO) → d = t / 58.0 cm → h = T_ref - d
    </text>
  </g>

  <!-- Arrow Read -> Decision Error -->
  <path d="M 480 276 L 480 298" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 4. DECISION: VALIDITAS SENSOR ================= -->
  <g transform="translate(360, 300)" filter="url(#fsmShadow)">
    <polygon points="120,0 240,32 120,64 0,32" fill="url(#nodeDecision)" stroke="#D97706" stroke-width="1.8"/>
    <text x="120" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">
      Apakah Sensor Valid?
    </text>
    <text x="120" y="45" font-family="'Courier New', monospace" font-size="9.5" fill="#B45309" text-anchor="middle">
      (d &gt; 0 &amp;&amp; d &lt; 400 cm)
    </text>
  </g>

  <!-- Branch Error (TIDAK) -> Right to SENSOR ERROR -->
  <path d="M 600 332 L 740 332 L 740 376" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#fsmArrowRed)"/>
  <rect x="625" y="316" width="60" height="20" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="655" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#DC2626" text-anchor="middle">TIDAK</text>

  <!-- Branch Valid (YA) -> Down -->
  <path d="M 480 364 L 480 394" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#fsmArrowGreen)"/>
  <rect x="490" y="369" width="36" height="20" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="508" y="383" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#059669" text-anchor="middle">YA</text>

  <!-- ================= 5. DECISION: KETINGGIAN AIR ================= -->
  <!-- 3 Branches: SAFE (< 60 cm), WARNING (60-79 cm), DANGER (>= 80 cm) -->
  <path d="M 480 394 L 140 394 L 140 424" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#fsmArrowGreen)"/>
  <path d="M 480 394 L 380 394 L 380 424" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#fsmArrowAmber)"/>
  <path d="M 480 394 L 600 394 L 600 424" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#fsmArrowRed)"/>

  <!-- ================= STATE 1: SAFE ================= -->
  <g transform="translate(45, 426)" filter="url(#fsmShadow)">
    <rect width="190" height="120" rx="8" fill="url(#stateSafe)" stroke="#059669" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 28 L 0 28 Z" fill="#059669"/>
    <text x="95" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: SAFE (AMAN)
    </text>
    <text x="95" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#065F46" text-anchor="middle">
      Tinggi Air &lt; 60 cm
    </text>
    <text x="14" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• LED Hijau : ON (GPIO 25)</text>
    <text x="14" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• LED Lain : OFF</text>
    <text x="14" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• Buzzer : PADAM</text>
    <text x="14" y="111" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• LCD : "STAT: AMAN"</text>
  </g>

  <!-- ================= STATE 2: WARNING ================= -->
  <g transform="translate(280, 426)" filter="url(#fsmShadow)">
    <rect width="200" height="120" rx="8" fill="url(#stateWarn)" stroke="#D97706" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 28 L 0 28 Z" fill="#D97706"/>
    <text x="100" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: WARNING (SIAGA)
    </text>
    <text x="100" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400E" text-anchor="middle">
      60 cm ≤ Tinggi Air &lt; 80 cm
    </text>
    <text x="14" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• LED Kuning : ON (GPIO 26)</text>
    <text x="14" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• LED Hijau &amp; Merah : OFF</text>
    <text x="14" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• Buzzer : PADAM</text>
    <text x="14" y="111" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#92400E">• LCD : "STAT: SIAGA"</text>
  </g>

  <!-- ================= STATE 3: DANGER ================= -->
  <g transform="translate(505, 426)" filter="url(#fsmShadow)">
    <rect width="190" height="120" rx="8" fill="url(#stateDanger)" stroke="#DC2626" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 28 L 0 28 Z" fill="#DC2626"/>
    <text x="95" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: DANGER (BAHAYA)
    </text>
    <text x="95" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991B1B" text-anchor="middle">
      Tinggi Air ≥ 80 cm
    </text>
    <text x="14" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#991B1B">• 3x LED Merah : STROBO</text>
    <text x="14" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#991B1B">  (Running Tengah-Tepi)</text>
    <text x="14" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#991B1B">• Buzzer : 1000 Hz BUNYI</text>
    <text x="14" y="111" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#991B1B">• LCD : "BAHAYA !!" + Bar</text>
  </g>

  <!-- ================= STATE 4: SENSOR ERROR ================= -->
  <g transform="translate(720, 378)" filter="url(#fsmShadow)">
    <rect width="195" height="116" rx="8" fill="url(#stateError)" stroke="#475569" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 187 0 Q 195 0 195 8 L 195 28 L 0 28 Z" fill="#475569"/>
    <text x="97" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      STATUS: SENSOR ERROR
    </text>
    <text x="14" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Sinyal Pantul Hilang / Timeout</text>
    <text x="14" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• LED Merah Kedip Bersama</text>
    <text x="14" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Buzzer Nada Putus-Putus</text>
    <text x="14" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• LCD: "SENSOR ERROR"</text>
  </g>

  <!-- Convergence Lines to Telemetry Task -->
  <path d="M 140 546 L 140 572 L 400 572" fill="none" stroke="#059669" stroke-width="2"/>
  <path d="M 380 546 L 380 572 L 400 572" fill="none" stroke="#D97706" stroke-width="2"/>
  <path d="M 600 546 L 600 572 L 560 572" fill="none" stroke="#DC2626" stroke-width="2"/>
  <path d="M 817 494 L 817 572 L 560 572" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 480 572 L 480 592" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- ================= 6. MULTI-TASK TIMERS (TELEMETRI & LCD) ================= -->
  <g transform="translate(230, 594)" filter="url(#fsmShadow)">
    <rect width="500" height="52" rx="8" fill="url(#nodeProcess)" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="250" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#6D28D9" text-anchor="middle">
      Tugas Non-Blocking Terjadwal (millis() Timer)
    </text>
    <text x="250" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      Setiap 2.000 ms: HTTP POST JSON ke Go Server • Setiap 2.500 ms: Rotasi Halaman LCD 16×2
    </text>
  </g>

  <!-- Loopback Line back to Sensor Reading (fill="none" explicitly set!) -->
  <path d="M 230 620 L 22 620 L 22 249 L 263 249" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#fsmArrowPurple)"/>
  <rect x="12" y="405" width="20" height="90" rx="4" fill="#DDD6FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="22" y="482" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#6D28D9" transform="rotate(-90, 22, 482)" text-anchor="middle">
    LOOP BERIKUTNYA (100 ms)
  </text>
</svg>
