<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <!-- Background styling -->
    <linearGradient id="circBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <!-- ESP32 Board Gradient -->
    <linearGradient id="espBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- LCD Screen Gradient -->
    <linearGradient id="lcdScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4DA4"/>
      <stop offset="100%" stop-color="#093678"/>
    </linearGradient>
    <filter id="chipShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="960" height="600" rx="10" fill="url(#circBg)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Banner Title -->
  <text x="480" y="32" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">
    DIAGRAM SIRKUIT SIMULASI WOKWI — SMART FLOOD MONITORING SYSTEM
  </text>
  <text x="480" y="52" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" fill="#2563EB">
    Kelompok 3 TI 2024I | https://wokwi.com/projects/477733466285817857
  </text>

  <!-- ================= 1. SENSOR ULTRASONIK HC-SR04 ================= -->
  <g transform="translate(40, 75)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="220" height="115" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
    <text x="110" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
      HC-SR04 ULTRASONIK
    </text>
    <!-- Transducer Eyes -->
    <circle cx="55" cy="65" r="28" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
    <circle cx="55" cy="65" r="18" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <text x="55" y="70" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#475569">T (TRIG)</text>

    <circle cx="165" cy="65" r="28" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
    <circle cx="165" cy="65" r="18" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <text x="165" y="70" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#475569">R (ECHO)</text>

    <!-- Pins Indicator at bottom -->
    <rect x="50" y="105" width="120" height="14" rx="2" fill="#0F172A"/>
    <text x="65" y="116" font-family="'Courier New', monospace" font-size="9" fill="#F87171" font-weight="bold">VCC</text>
    <text x="95" y="116" font-family="'Courier New', monospace" font-size="9" fill="#4ADE80" font-weight="bold">TRIG</text>
    <text x="125" y="116" font-family="'Courier New', monospace" font-size="9" fill="#38BDF8" font-weight="bold">ECHO</text>
    <text x="155" y="116" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8" font-weight="bold">GND</text>
  </g>

  <!-- ================= 2. LCD 16x2 I2C MODULE ================= -->
  <g transform="translate(40, 215)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="220" height="135" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <text x="110" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F8FAFC">
      LCD 1602 I2C (Alamat 0x27)
    </text>
    <!-- Screen -->
    <rect x="15" y="32" width="190" height="65" rx="4" fill="url(#lcdScreen)"/>
    <text x="25" y="58" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">
      Jarak: 40 cm
    </text>
    <text x="25" y="78" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">
      Tinggi: 60 cm
    </text>

    <!-- I2C Backpack Header -->
    <rect x="25" y="105" width="170" height="20" rx="3" fill="#0F172A"/>
    <text x="45" y="119" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8" font-weight="bold">GND</text>
    <text x="85" y="119" font-family="'Courier New', monospace" font-size="9" fill="#F87171" font-weight="bold">VCC</text>
    <text x="125" y="119" font-family="'Courier New', monospace" font-size="9" fill="#4ADE80" font-weight="bold">SDA</text>
    <text x="165" y="119" font-family="'Courier New', monospace" font-size="9" fill="#60A5FA" font-weight="bold">SCL</text>
  </g>

  <!-- ================= 3. LOCAL INDICATORS: 3 LEDs & BUZZER ================= -->
  <g transform="translate(40, 375)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="220" height="195" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="110" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">
      INDIKATOR LOKAL &amp; ALARM
    </text>

    <!-- LED Hijau -->
    <circle cx="45" cy="58" r="14" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
    <text x="80" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">LED Hijau (SAFE)</text>
    <text x="80" y="68" font-family="'Courier New', monospace" font-size="10" fill="#64748B">GPIO 25 + 220 Ω</text>

    <!-- LED Kuning -->
    <circle cx="45" cy="98" r="14" fill="#EAB308" stroke="#A16207" stroke-width="2"/>
    <text x="80" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">LED Kuning (WARN)</text>
    <text x="80" y="108" font-family="'Courier New', monospace" font-size="10" fill="#64748B">GPIO 26 + 220 Ω</text>

    <!-- LED Merah -->
    <circle cx="45" cy="138" r="14" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
    <text x="80" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">LED Merah (DANGER)</text>
    <text x="80" y="148" font-family="'Courier New', monospace" font-size="10" fill="#64748B">GPIO 27 + 220 Ω</text>

    <!-- Buzzer -->
    <circle cx="45" cy="172" r="11" fill="#334155" stroke="#0F172A" stroke-width="2"/>
    <text x="80" y="169" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">Piezo Buzzer (1 kHz)</text>
    <text x="80" y="182" font-family="'Courier New', monospace" font-size="10" fill="#DC2626" font-weight="bold">GPIO 14 (No Conflict)</text>
  </g>

  <!-- ================= 4. ESP32 DEVKIT-C V4 (CENTER/RIGHT) ================= -->
  <g transform="translate(370, 75)" filter="url(#chipShadow)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="220" height="495" rx="10" fill="url(#espBg)" stroke="#334155" stroke-width="2"/>
    <!-- Mounting Holes -->
    <circle cx="15" cy="15" r="4" fill="#64748B"/>
    <circle cx="205" cy="15" r="4" fill="#64748B"/>
    <circle cx="15" cy="480" r="4" fill="#64748B"/>
    <circle cx="205" cy="480" r="4" fill="#64748B"/>

    <!-- ESP-WROOM-32 Metal Can / RF Shield -->
    <rect x="40" y="55" width="140" height="150" rx="4" fill="#94A3B8" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Antenna Cutout -->
    <rect x="65" y="20" width="90" height="30" rx="2" fill="#020617"/>
    <path d="M75 25 h70 M75 32 h70 M75 39 h70" stroke="#F59E0B" stroke-width="1.5"/>

    <text x="110" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A">
      ESP32
    </text>
    <text x="110" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#334155">
      DevKit-C V4
    </text>
    <text x="110" y="155" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#1E293B">
      Wi-Fi 802.11 b/g/n
    </text>

    <!-- USB Port -->
    <rect x="80" y="465" width="60" height="30" rx="3" fill="#64748B" stroke="#94A3B8"/>

    <!-- Left Pin Header (Pins wired) -->
    <g transform="translate(8, 220)" font-family="'Courier New', monospace" font-size="10" font-weight="bold">
      <!-- 5V -->
      <rect x="0" y="0" width="35" height="18" rx="2" fill="#EF4444"/>
      <text x="17" y="13" text-anchor="middle" fill="#FFFFFF">5V</text>
      <!-- GND -->
      <rect x="0" y="24" width="35" height="18" rx="2" fill="#0F172A"/>
      <text x="17" y="37" text-anchor="middle" fill="#FFFFFF">GND</text>
      <!-- GPIO 5 (TRIG) -->
      <rect x="0" y="48" width="35" height="18" rx="2" fill="#10B981"/>
      <text x="17" y="61" text-anchor="middle" fill="#FFFFFF">D5</text>
      <!-- GPIO 18 (ECHO) -->
      <rect x="0" y="72" width="35" height="18" rx="2" fill="#0284C7"/>
      <text x="17" y="85" text-anchor="middle" fill="#FFFFFF">D18</text>
      <!-- GPIO 21 (SDA) -->
      <rect x="0" y="96" width="35" height="18" rx="2" fill="#10B981"/>
      <text x="17" y="109" text-anchor="middle" fill="#FFFFFF">D21</text>
      <!-- GPIO 22 (SCL) -->
      <rect x="0" y="120" width="35" height="18" rx="2" fill="#2563EB"/>
      <text x="17" y="133" text-anchor="middle" fill="#FFFFFF">D22</text>
    </g>

    <!-- Right Pin Header -->
    <g transform="translate(177, 220)" font-family="'Courier New', monospace" font-size="10" font-weight="bold">
      <!-- GPIO 25 (LED Hijau) -->
      <rect x="0" y="0" width="35" height="18" rx="2" fill="#16A34A"/>
      <text x="17" y="13" text-anchor="middle" fill="#FFFFFF">D25</text>
      <!-- GPIO 26 (LED Kuning) -->
      <rect x="0" y="24" width="35" height="18" rx="2" fill="#CA8A04"/>
      <text x="17" y="37" text-anchor="middle" fill="#FFFFFF">D26</text>
      <!-- GPIO 27 (LED Merah) -->
      <rect x="0" y="48" width="35" height="18" rx="2" fill="#DC2626"/>
      <text x="17" y="61" text-anchor="middle" fill="#FFFFFF">D27</text>
      <!-- GPIO 14 (Buzzer) -->
      <rect x="0" y="72" width="35" height="18" rx="2" fill="#9333EA"/>
      <text x="17" y="85" text-anchor="middle" fill="#FFFFFF">D14</text>
    </g>

    <!-- Status Pin Label Notes -->
    <text x="110" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#94A3B8">
      Dual Core 240 MHz
    </text>
    <text x="110" y="396" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#94A3B8">
      FreeRTOS / Arduino Core
    </text>
    <text x="110" y="420" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#38BDF8">
      PubSubClient + Wire
    </text>
  </g>

  <!-- ================= 5. RIGHT PANEL: NETWORK & TELEMETRY ================= -->
  <g transform="translate(680, 75)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="240" height="495" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Cloud / Broker Card -->
    <rect x="15" y="20" width="210" height="100" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="120" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F172A">
      BROKER MQTT PUBLIK
    </text>
    <text x="120" y="68" font-family="'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#2563EB">
      test.mosquitto.org
    </text>
    <text x="120" y="88" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#64748B">
      Port: 1883 (TCP)
    </text>
    <text x="120" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#16A34A">
      ● Terhubung (Wokwi-GUEST)
    </text>

    <!-- MQTT Topic Card -->
    <rect x="15" y="135" width="210" height="75" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="25" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#475569">
      TOPIC TELEMETRI:
    </text>
    <text x="25" y="174" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#0F172A">
      ti2024i/kelompok3/
    </text>
    <text x="25" y="190" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#0F172A">
      smartflood/data
    </text>

    <!-- JSON Structure Card -->
    <rect x="15" y="225" width="210" height="155" rx="6" fill="#0F172A"/>
    <text x="25" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">
      FORMAT PAYLOAD JSON:
    </text>
    <g transform="translate(25, 270)" font-family="'Courier New', monospace" font-size="10">
      <text y="0" fill="#E2E8F0">{</text>
      <text y="18" fill="#94A3B8">  "distance_cm": <tspan fill="#FBBF24">40.0</tspan>,</text>
      <text y="36" fill="#94A3B8">  "water_level_cm": <tspan fill="#FBBF24">60.0</tspan>,</text>
      <text y="54" fill="#94A3B8">  "status": <tspan fill="#4ADE80">"WARN"</tspan></text>
      <text y="72" fill="#E2E8F0">}</text>
      <text y="94" fill="#64748B">// Publish tiap 2000 ms</text>
    </g>

    <!-- Summary Box -->
    <rect x="15" y="395" width="210" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="25" y="418" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">
      Proteksi Konflik Bus I2C:
    </text>
    <text x="25" y="438" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">
      • SDA: GPIO 21 (LCD)
    </text>
    <text x="25" y="454" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">
      • SCL: GPIO 22 (LCD)
    </text>
    <text x="25" y="470" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#DC2626" font-weight="bold">
      • Buzzer: GPIO 14 (Aman)
    </text>
  </g>

  <!-- ================= WIRING CONNECTION LINES WITH LABELS ================= -->
  <!-- Wire: TRIG (HC-SR04 -> ESP D5) -->
  <path d="M145 190 L145 205 L350 205 L350 277 L378 277" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <!-- Wire: ECHO (HC-SR04 -> ESP D18) -->
  <path d="M175 190 L175 210 L340 210 L340 301 L378 301" fill="none" stroke="#0284C7" stroke-width="2.5"/>

  <!-- Wire: LCD SDA -> ESP D21 -->
  <path d="M165 340 L165 350 L330 350 L330 325 L378 325" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <!-- Wire: LCD SCL -> ESP D22 -->
  <path d="M205 340 L205 355 L320 355 L320 349 L378 349" fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Wire: ESP D25 -> LED Hijau -->
  <path d="M582 229 L620 229 L620 433 L260 433" fill="none" stroke="#16A34A" stroke-width="2"/>
  <!-- Wire: ESP D26 -> LED Kuning -->
  <path d="M582 253 L630 253 L630 473 L260 473" fill="none" stroke="#CA8A04" stroke-width="2"/>
  <!-- Wire: ESP D27 -> LED Merah -->
  <path d="M582 277 L640 277 L640 513 L260 513" fill="none" stroke="#DC2626" stroke-width="2"/>
  <!-- Wire: ESP D14 -> Buzzer -->
  <path d="M582 301 L650 301 L650 547 L260 547" fill="none" stroke="#9333EA" stroke-width="2"/>

  <!-- Wi-Fi Waves Icon between ESP and Cloud -->
  <g transform="translate(620, 115)">
    <path d="M0 0 A 25 25 0 0 1 35 0" fill="none" stroke="#0284C7" stroke-width="3"/>
    <path d="M5 8 A 18 18 0 0 1 30 8" fill="none" stroke="#0284C7" stroke-width="3"/>
    <circle cx="17.5" cy="18" r="3.5" fill="#0284C7"/>
    <text x="17.5" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0284C7">Wi-Fi</text>
  </g>
</svg>
