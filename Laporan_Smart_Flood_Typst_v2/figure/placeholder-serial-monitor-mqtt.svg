<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mqttCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="920" height="500" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Header Title -->
  <text x="460" y="32" font-family="'Courier New', monospace, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0F172A">
    LOG SERIAL MONITOR &amp; TELEMETRI MQTT (test.mosquitto.org)
  </text>
  <text x="460" y="52" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">
    Frekuensi Pengiriman Telemetri: 2.000 ms (2 Detik) | Kecepatan Serial: 115.200 bps
  </text>

  <!-- ================= LEFT PANEL: SERIAL MONITOR ================= -->
  <g transform="translate(25, 70)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="455" height="400" rx="8" fill="url(#termBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect x="0" y="0" width="455" height="34" rx="8" fill="#1E293B"/>
    <rect x="0" y="26" width="455" height="8" fill="#1E293B"/>
    <circle cx="20" cy="17" r="5" fill="#EF4444"/>
    <circle cx="36" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="5" fill="#10B981"/>
    <text x="240" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E2E8F0">
      Serial Monitor — 115200 baud (Wokwi)
    </text>

    <!-- Terminal Content -->
    <g transform="translate(18, 55)" font-family="'Courier New', monospace" font-size="11.5">
      <text y="0" fill="#38BDF8">Smart Flood System + LCD starting...</text>
      <text y="16" fill="#94A3B8">LCD I2C address: 0x27, SDA GPIO21, SCL GPIO22</text>
      <text y="32" fill="#94A3B8">Buzzer moved to GPIO14 to avoid I2C conflict.</text>
      <text y="48" fill="#94A3B8">Wi-Fi: Wokwi-GUEST | MQTT: test.mosquitto.org:1883</text>
      <text y="64" fill="#34D399">[WiFi] Connected! IP: 10.0.1.15</text>
      <text y="80" fill="#34D399">[MQTT] Connecting... CONNECTED</text>
      
      <text y="102" fill="#64748B">========================================</text>
      <text y="118" fill="#F8FAFC" font-weight="bold"> SMART FLOOD MONITORING SYSTEM + LCD   </text>
      <text y="134" fill="#64748B">========================================</text>
      <text y="150" fill="#F8FAFC">Jarak sensor : <tspan fill="#FBBF24" font-weight="bold">40.0 cm</tspan></text>
      <text y="166" fill="#F8FAFC">Tinggi air   : <tspan fill="#FBBF24" font-weight="bold">60.0 cm</tspan></text>
      <text y="182" fill="#F8FAFC">Status       : <tspan fill="#FBBF24" font-weight="bold">WARNING</tspan></text>
      <text y="198" fill="#F8FAFC">Wi-Fi        : <tspan fill="#34D399">CONNECTED</tspan></text>
      <text y="214" fill="#F8FAFC">MQTT         : <tspan fill="#34D399">CONNECTED</tspan></text>
      <text y="230" fill="#94A3B8">LCD          : 3 rotating information pages</text>
      <text y="246" fill="#64748B">========================================</text>
      
      <text y="270" fill="#34D399" font-weight="bold">[MQTT] Publish: OK</text>
      <text y="286" fill="#E2E8F0">[MQTT] Topic: ti2024i/kelompok3/smartflood/data</text>
      <text y="302" fill="#38BDF8">[MQTT] Payload: {"distance_cm":40.0,</text>
      <text y="318" fill="#38BDF8">                 "water_level_cm":60.0,</text>
      <text y="334" fill="#38BDF8">                 "status":"WARNING"}</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: MQTT SUBSCRIBER ================= -->
  <g transform="translate(495, 70)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="400" height="400" rx="8" fill="url(#mqttCardBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect x="0" y="0" width="400" height="34" rx="8" fill="#1E293B"/>
    <rect x="0" y="26" width="400" height="8" fill="#1E293B"/>
    <text x="200" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#38BDF8">
      MQTT Subscriber Client (Data Monitor)
    </text>

    <!-- Broker Details Card -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="368" height="65" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="12" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">BROKER MQTT PUBLIK:</text>
      <text x="145" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F8FAFC">test.mosquitto.org:1883</text>
      <text x="12" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">CLIENT ID ESP32:</text>
      <text x="145" y="38" font-family="'Courier New', monospace" font-size="12" fill="#38BDF8">SmartFloodLCD-K3-E84A</text>
      <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">STATUS JARINGAN:</text>
      <text x="145" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34D399">TERHUBUNG (QoS 0)</text>
    </g>

    <!-- Topic Card -->
    <g transform="translate(16, 122)">
      <rect x="0" y="0" width="368" height="42" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">SUBSCRIPTION TOPIC:</text>
      <text x="12" y="34" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#38BDF8">ti2024i/kelompok3/smartflood/data</text>
    </g>

    <!-- JSON Payload Card -->
    <g transform="translate(16, 174)">
      <rect x="0" y="0" width="368" height="210" rx="5" fill="#0F172A" stroke="#334155"/>
      <text x="12" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34D399">
        PARSED JSON PAYLOAD (TELEMETRI LIVE):
      </text>

      <g transform="translate(15, 42)" font-family="'Courier New', monospace" font-size="13">
        <text y="0" fill="#E2E8F0">{</text>
        
        <text y="24" fill="#38BDF8">  "distance_cm"</text>
        <text y="24" x="140" fill="#E2E8F0">: </text>
        <text y="24" x="155" fill="#FBBF24" font-weight="bold">40.0</text>
        <text y="24" x="195" fill="#94A3B8">,  /* cm */</text>

        <text y="48" fill="#38BDF8">  "water_level_cm"</text>
        <text y="48" x="140" fill="#E2E8F0">: </text>
        <text y="48" x="155" fill="#FBBF24" font-weight="bold">60.0</text>
        <text y="48" x="195" fill="#94A3B8">,  /* cm */</text>

        <text y="72" fill="#38BDF8">  "status"</text>
        <text y="72" x="140" fill="#E2E8F0">: </text>
        <text y="72" x="155" fill="#FBBF24" font-weight="bold">"WARNING"</text>

        <text y="96" fill="#E2E8F0">}</text>
      </g>

      <!-- Analysis Badge inside Payload Card -->
      <g transform="translate(12, 148)">
        <rect x="0" y="0" width="344" height="50" rx="4" fill="#1E293B"/>
        <text x="10" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">
          Indikasi Logika:
        </text>
        <text x="105" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#E2E8F0">
          50 cm ≤ Tinggi Air (60 cm) &lt; 80 cm
        </text>
        <text x="10" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">
          Status aktif: WARNING — LED Kuning ON, Buzzer OFF
        </text>
      </g>
    </g>
  </g>
</svg>
